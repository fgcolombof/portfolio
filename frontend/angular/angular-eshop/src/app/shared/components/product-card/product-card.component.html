<a
  [routerLink]="['/product', product.id]"
  class="block bg-white rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 overflow-hidden group cursor-pointer border border-gray-100"
>
  <!-- Product Image -->
  <div class="aspect-square overflow-hidden bg-gray-50 p-4">
    <img
      [src]="product.image"
      [alt]="product.title"
      class="w-full h-full object-contain group-hover:scale-105 transition-transform duration-300"
    />
  </div>

  <!-- Product Info -->
  <div class="p-4 space-y-3">
    <!-- Category Badge -->
    <div class="flex items-center justify-between">
      <span
        class="inline-block px-2 py-1 text-xs font-medium bg-indigo-50 text-indigo-700 rounded-full"
      >
        {{ product.category }}
      </span>
      <!-- Rating -->
      <div class="flex items-center space-x-1">
        <span class="text-yellow-400">★</span>
        <span class="text-sm text-gray-600">{{ product.rating.rate }}</span>
        <span class="text-xs text-gray-400">({{ product.rating.count }})</span>
      </div>
    </div>

    <!-- Title -->
    <h3 class="font-semibold text-gray-900 line-clamp-2 leading-tight">
      {{ product.title }}
    </h3>

    <!-- Description -->
    <p class="text-sm text-gray-600 line-clamp-2 leading-relaxed">
      {{ product.description }}
    </p>

    <!-- Price & Actions -->
    <div class="flex items-center justify-between pt-2 border-t border-gray-100">
      <span class="text-2xl font-bold text-gray-900"> ${{ product.price.toFixed(2) }} </span>
      <div class="flex space-x-2">
        <button
          class="px-3 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors duration-200"
        >
          Details
        </button>
        <button
          class="px-3 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors duration-200 shadow-sm hover:shadow-md"
        >
          More Details
        </button>
      </div>
    </div>
  </div>
</a>
